<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画像表示</title>
    <style>
      body {
        background-color: #1b3b2b; /* 背景を深緑に統一してもおしゃれ */
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      img {
        max-width: 400px; /* 【追加】横幅の上限をピクセルで小さく制限する */
        width: 100%; /* 比率を保ったまま縮むようにする */
        height: auto;
        border: 4px solid #c5a059;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      }
      .back-link {
        margin-top: 20px;
        color: #c5a059;
        text-decoration: none;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- ここに表示したい写真を1枚入れる -->
    <img src="images/gyarari.png" alt="写真" />

    <!-- Libraryページに戻るリンク -->
    <a href="library.html" class="back-link">← Libraryに戻る</a>
  </body>
</html>
